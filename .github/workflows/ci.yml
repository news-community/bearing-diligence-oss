name: ci

# Every push to main and every pull request: the tests, the gates over the code, the document checks,
# the proof that each of those can fail, and the app itself driven through its real window.
#
# A runner has no model runtime, so the tests that need one report "did not run" by name, as they do
# on any machine without it. The OCR engine is installed, so the scanned-page tests do run. SKIPS_OK=1 says that is expected here; it does not
# hide them, and the log lists every one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SKIPS_OK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: OCR engine, for the scanned-page tests
        run: brew install tesseract
      - name: Tests
        run: npm test
      - name: Gates over the code, and the proof each fires
        run: npm run gates && npm run prove
      - name: Document checks, and the proof each fires
        run: npm run senses
      - name: The app, driven through its real window
        timeout-minutes: 10
        run: npm run smoke
